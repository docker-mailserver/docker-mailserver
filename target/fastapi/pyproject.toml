[project]
name = "mailserver-api"
version = "1.0.0"
description = "REST API for managing docker-mailserver mailboxes, aliases, quotas and Dovecot master users"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.139.0",
  "pydantic-settings>=2.6.0",
]

[dependency-groups]
# Only pulled into the image when built with `--build-arg API_DEBUG=1`; the default
# build passes `--no-dev` to `uv sync` so production images never carry this.
dev = ["debugpy>=1.8.11"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
