## Dovecot configuration file
#
# DMS ships this file instead of using the one provided by the package, because
# Debian and the Dovecot community repository ship different files. This file
# must stay compatible with the oldest Dovecot version DMS installs (Debian's
# on non-x86_64 architectures).
#
# "doveconf -n" gives a clean output of the changed settings.

# Newer versions change defaults or on-disk formats (blocking downgrades), and
# are not understood by older Dovecot versions.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# Protocols we want to be serving (set by DMS during startup).
#protocols =

# A comma separated list of IPs or hosts where to listen in for connections.
# "*" listens in all IPv4 interfaces, "::" listens in all IPv6 interfaces.
# (set by DMS during startup according to `DOVECOT_INET_PROTOCOLS`)
#listen = *, ::

!include conf.d/*.conf

# User overrides (`dovecot.cf`) are copied here by DMS.
!include_try local.conf
