# Intelligent learning of Junk for Rspamd (`RSPAMD_LEARN=1`).
# Copied to `features.d/` by `__rspamd__setup_learning`.
#
# The Sieve scripts in `/usr/lib/dovecot/sieve-pipe` are created by `__rspamd__setup_learning`.
#
# ref: https://doc.dovecot.org/main/core/plugins/imap_sieve.html

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

mailbox Junk {
  sieve_script learn_spam {
    cause = append copy
    driver = file
    name = Learn Spam
    path = /usr/lib/dovecot/sieve-pipe/learn-spam.sieve
    type = before
  }
}

imapsieve_from Junk {
  sieve_script learn_ham {
    cause = append copy
    name = Learn Ham
    path = /usr/lib/dovecot/sieve-pipe/learn-ham.sieve
    type = before
  }
}
