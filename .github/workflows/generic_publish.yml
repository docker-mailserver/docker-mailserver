name: 'Publish the DMS Container Image'

on:
  workflow_call:
    inputs:
      # Release tag (eg `v16.0.1`) to (re)publish. Defaults to the triggering tag, if any:
      release-tag:
        required: false
        type: string
        default: ''
      # Rebuild counter for the immutable `X.Y.Z-rN` tag (`0` is the original release build):
      rebuild:
        required: false
        type: string
        default: '0'
      # Whether this release also gets the `latest` tag:
      latest:
        required: false
        type: boolean
        default: true
      # Build everything but do not push any image:
      dry-run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: 'Publish'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          submodules: recursive

      # Pushes of a tag publish that release. Scheduled rebuilds provide the tag as an input.
      - name: 'Resolve release tag'
        id: release
        shell: bash
        run: |
          if [[ -n ${INPUT_TAG} ]]; then
            echo "tag=${INPUT_TAG}" >>"${GITHUB_OUTPUT}"
          elif [[ ${GITHUB_REF_TYPE} == tag ]]; then
            echo "tag=${GITHUB_REF_NAME}" >>"${GITHUB_OUTPUT}"
          else
            echo 'tag=' >>"${GITHUB_OUTPUT}"
          fi
        env:
          INPUT_TAG: ${{ inputs.release-tag }}

      - name: 'Prepare tags'
        id: prep
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ secrets.DOCKER_REPOSITORY }}
            ${{ secrets.GHCR_REPOSITORY }}
          # `latest` is added explicitly below, so rebuilding an older release cannot claim it
          flavor: |
            latest=false
          tags: |
            type=edge,branch=master,enable=${{ steps.release.outputs.tag == '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.tag != '' && inputs.latest }}
            type=semver,pattern={{version}}-r${{ inputs.rebuild }},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.4.1

      - name: 'Login to DockerHub'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and publish images'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            DMS_RELEASE=${{ steps.release.outputs.tag || 'edge' }}
            VCS_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: |
            type=gha,scope=linux-amd64
            type=gha,scope=linux-arm64
          # Disable provenance attestation: https://docs.docker.com/build/attestations/slsa-provenance/
          provenance: false
